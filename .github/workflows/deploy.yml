name: Check website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-site-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.20.0'
      - name: Install pinned uv
        run: python -m pip install uv==0.12.7
      - name: Test and build reviewed content
        run: make test && make build
# Checks run on GitHub-hosted runners only, including PRs.
# The private website VM polls trusted main and runs its own checks before
# atomic deployment. No self-hosted runner, extra VM, or GitHub deploy secrets.
