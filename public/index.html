<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tin Nguyen's personal website. Based in Ho Chi Minh City, Vietnam.">
  <meta name="theme-color" content="#f4f2ec">
  <title>Tin Nguyen — Personal website</title>
  <link rel="canonical" href="https://tinnguyen.exe.xyz/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/site.css">
  <script type="module" src="/globe.js"></script>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <a class="monogram" href="/" aria-label="Tin Nguyen, home">tn.</a>
      <span class="status"><span class="status-dot" aria-hidden="true"></span>A work in progress</span>
    </header>
    <main id="main">
      <div class="hero">
        <div class="hero-copy">
          <p class="eyebrow">A little corner of the internet</p>
          <h1>Tin<br><span>Nguyen.</span></h1>
          <p class="intro">A new home for my work, notes, and things worth sharing.</p>
          <p class="coming-soon">This space is taking shape. More soon.</p>
        </div>
        <figure class="location" aria-labelledby="location-title">
          <div class="globe-stage" id="globe-stage" data-state="loading" aria-hidden="true" hidden>
            <canvas id="globe" width="480" height="480"></canvas>
            <span class="globe-pin" id="globe-pin" hidden>Ho Chi Minh City</span>
          </div>
          <figcaption>
            <p class="location-eyebrow"><span class="location-dot" aria-hidden="true"></span>Based in</p>
            <h2 id="location-title">Ho Chi Minh City<span>, Vietnam</span></h2>
            <p class="coordinates">10.8231° N &nbsp; 106.6297° E</p>
            <button class="globe-control" id="globe-motion" type="button" aria-pressed="false" hidden>Pause motion</button>
            <p class="globe-status" id="globe-status" hidden>The globe isn’t available in this browser.</p>
            <noscript><p class="globe-status">Enable JavaScript to see the globe.</p></noscript>
          </figcaption>
        </figure>
      </div>
    </main>
    <footer>
      <span>Personal website</span>
      <span class="footer-note">Built to grow, one idea at a time.</span>
    </footer>
  </div>
</body>
</html>
