{% set position = art_position|default('header') %}
<div class="art-banner art-{{ position }}" id="art-{{ position }}" data-art="{{ position }}" data-state="fallback">
  <div class="art-surface" aria-hidden="true">
    <div class="art-fallback" id="{{ 'art-fallback' if position == 'header' else 'footer-art-fallback' }}"></div>
    <canvas id="{{ position }}-art-canvas" width="480" height="60" hidden></canvas>
  </div>
  <button class="art-motion" id="{{ 'art-motion' if position == 'header' else 'footer-art-motion' }}" type="button" aria-label="Pause art animations ({{ position }} control)" hidden>Pause art</button>
</div>
